name: QIT Tests

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  qit-tests:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          tools: composer:2.9.1
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install production Composer dependencies
        run: composer install --prefer-dist --no-dev --no-interaction --no-progress

      - name: Build plugin zip
        run: |
          npm ci
          npm run build:qit

      - name: Upload plugin zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: woocommerce-fraud-protection-${{ github.sha }}
          path: |
            woocommerce-fraud-protection.zip
            woocommerce-fraud-protection-qit.zip
          retention-days: 7

      - name: Install QIT CLI
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Authenticate QIT
        env:
          QIT_APP_PASS: ${{ secrets.QIT_APP_PASS }}
          QIT_USER: ${{ secrets.QIT_USER }}
        run: vendor/bin/qit partner:add --user="$QIT_USER" --application_password="$QIT_APP_PASS"

      - name: Run Activation Test
        run: vendor/bin/qit run:activation woocommerce-fraud-protection --zip=woocommerce-fraud-protection-qit.zip --wait

      - name: Run Security Test
        run: vendor/bin/qit run:security woocommerce-fraud-protection --zip=woocommerce-fraud-protection-qit.zip --wait
