name: Test the build

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLUGIN_SLUG: woocommerce-fraud-protection

jobs:
  build:
    name: Build the plugin zip
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      beta-builder: ${{ steps.beta-builder.outputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          tools: composer:2.9.1, wp:2.12.0
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install production Composer dependencies
        run: composer install --prefer-dist --no-dev --no-interaction --no-progress

      # The Plugins screen then shows which pull request and commit a test site runs.
      # Only the header changes: the version the plugin reports at runtime stays the released one.
      - name: Mark the build with the pull request and commit
        id: dev-version
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          version=$(sed -n 's/^ \* Version: \(.*\)$/\1/p' "$PLUGIN_SLUG.php")
          if [ -z "$version" ]; then
            echo "::error::No Version header found in $PLUGIN_SLUG.php."
            exit 1
          fi
          dev_version="${version}-dev_PR-${PR_NUMBER}_commit-${PR_HEAD_SHA:0:7}"
          sed -i "s/^ \* Version: .*$/ * Version: ${dev_version}/" "$PLUGIN_SLUG.php"
          echo "version=$dev_version" >> "$GITHUB_OUTPUT"
          echo "Build version: $dev_version" >> "$GITHUB_STEP_SUMMARY"

      - name: Build plugin zip
        run: |
          npm ci
          npm run build:release

      # One artifact holds everything a WordPress Playground preview needs, so a link can never
      # pair the zip of one run with the setup files of another. The Playground links download it
      # on every click, hence the retention.
      - name: Collect the files for the Playground preview
        run: |
          mkdir playground-preview
          cp "$PLUGIN_SLUG.zip" bin/playground-setup.php bin/seed-fake-sessions.php bin/seed-fake-rules.php playground-preview/

      - name: Upload the Playground preview files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playground-preview-${{ github.run_id }}
          path: playground-preview
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      # Jetpack Beta and Jurassic Ninja install the builds that the Jetpack Beta Builder serves.
      # That needs the plugin to be registered there and a webhook secret in this repository.
      # Until both exist, and on pull requests that get no secrets (forks, Dependabot), the
      # steps below are skipped and the comment says the two options are not available.
      - name: Check whether the Jetpack Beta Builder can take this build
        id: beta-builder-check
        env:
          SECRET: ${{ secrets.FRAUD_PROTECTION_LIVE_BRANCH_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            status=no-secret
          elif ! curl -sS --fail --max-time 30 https://betadownload.jetpack.me/plugins.json | jq -e --arg slug "$PLUGIN_SLUG" 'has($slug)' > /dev/null; then
            status=not-registered
          else
            status=ready
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Jetpack Beta Builder: $status" >> "$GITHUB_STEP_SUMMARY"

      # The Beta Builder expects an artifact named "plugins" that holds <slug>-dev.zip
      # with the plugin in a <slug>-dev folder, so the build installs next to a released copy.
      - name: Repackage the zip for the Jetpack Beta Builder
        if: steps.beta-builder-check.outputs.status == 'ready'
        run: |
          mkdir plugins
          unzip -q "$PLUGIN_SLUG.zip" -d plugins
          cd plugins
          mv "$PLUGIN_SLUG" "$PLUGIN_SLUG-dev"
          zip -q -r "$PLUGIN_SLUG-dev.zip" "$PLUGIN_SLUG-dev"
          rm -r "$PLUGIN_SLUG-dev"

      - name: Upload the zip for the Jetpack Beta Builder
        if: steps.beta-builder-check.outputs.status == 'ready'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugins # The name the Jetpack Beta Builder looks for.
          path: plugins
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Tell the Jetpack Beta Builder about the build
        id: beta-builder
        env:
          CHECK_STATUS: ${{ steps.beta-builder-check.outputs.status }}
          SECRET: ${{ secrets.FRAUD_PROTECTION_LIVE_BRANCH_SECRET }}
          DEV_VERSION: ${{ steps.dev-version.outputs.version }}
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          status=$CHECK_STATUS
          if [ "$status" = ready ]; then
            plugin_data=$(jq -cn --arg slug "$PLUGIN_SLUG" --arg version "$DEV_VERSION" '{ ($slug): { version: $version } }')
            # GITHUB_REF is refs/pull/<number>/merge here, so the branch name is sent explicitly:
            # it is what Jetpack Beta and Jurassic Ninja look the build up by.
            if curl -sS --fail -L --max-time 120 -o /dev/null \
              --url "https://betadownload.jetpack.me/gh-action.php?run_id=$GITHUB_RUN_ID&pr=$PR_NUMBER&commit=$GITHUB_SHA" \
              --form-string "repo=$GITHUB_REPOSITORY" \
              --form-string "branch=$PR_HEAD_REF" \
              --form-string "plugins=$plugin_data" \
              --form-string "secret=$SECRET"; then
              status=sent
            else
              status=refused
              echo "::warning::The Jetpack Beta Builder did not accept the build."
            fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

  comment:
    name: Comment on the pull request
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write

    steps:
      # WordPress Playground runs in the visitor's browser and only fetches public URLs. Its
      # artifact proxy serves the artifacts of this workflow for the pull request, and finds the
      # workflow by name, hence GITHUB_WORKFLOW instead of a literal that a rename would break.
      # The artifact is a zip around the uploaded files, so the Blueprints unzip it first.
      - name: Build the WordPress Playground links
        id: playground
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          artifact_url=$(jq -rn \
            --arg org "$GITHUB_REPOSITORY_OWNER" \
            --arg repo "${GITHUB_REPOSITORY#*/}" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg pr "$PR_NUMBER" \
            --arg artifact "playground-preview-$GITHUB_RUN_ID" \
            '"https://playground.wordpress.net/plugin-proxy.php?org=\($org|@uri)&repo=\($repo|@uri)&workflow=\($workflow|@uri)&pr=\($pr|@uri)&artifact=\($artifact|@uri)"')

          blueprints=$(jq -cn --arg artifact "$artifact_url" --arg slug "$PLUGIN_SLUG" '
            {
              "$schema": "https://playground.wordpress.net/blueprint-schema.json",
              landingPage: "/wp-admin/admin.php?page=wc-settings&tab=woocommerce_fraud_protection",
              preferredVersions: { php: "8.3", wp: "latest" },
              features: { networking: true }
            } as $base
            | [
                { step: "login", username: "admin" },
                { step: "installPlugin", pluginData: { resource: "wordpress.org/plugins", slug: "woocommerce" }, options: { activate: true } },
                { step: "unzip", zipFile: { resource: "url", url: $artifact, caption: "Downloading the Fraud Protection build for this PR" }, extractToPath: "/tmp/pr" },
                { step: "installPlugin", pluginData: { resource: "vfs", path: ( "/tmp/pr/" + $slug + ".zip" ) }, options: { activate: true } }
              ] as $install
            | {
                sample: ( $base + { steps: ( $install + [ { step: "wp-cli", command: "wp eval-file /tmp/pr/playground-setup.php" } ] ) } ),
                empty: ( $base + { steps: ( $install + [ { step: "wp-cli", command: "wp eval-file /tmp/pr/playground-setup.php empty" } ] ) } )
              }')

          {
            echo "sample_url=https://playground.wordpress.net/#$(jq -rn --argjson blueprints "$blueprints" '$blueprints.sample|tojson|@uri')"
            echo "empty_url=https://playground.wordpress.net/#$(jq -rn --argjson blueprints "$blueprints" '$blueprints.empty|tojson|@uri')"
          } >> "$GITHUB_OUTPUT"

      - name: Write the comment
        env:
          BETA_BUILDER: ${{ needs.build.outputs.beta-builder }}
          PLAYGROUND_SAMPLE_URL: ${{ steps.playground.outputs.sample_url }}
          PLAYGROUND_EMPTY_URL: ${{ steps.playground.outputs.empty_url }}
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Keep the slashes of a branch name readable in the link, and encode everything else.
          branch_in_url=$(jq -rn --arg ref "$PR_HEAD_REF" '$ref | @uri | gsub("%2F"; "/")')

          case "$BETA_BUILDER" in
            sent) ;;
            no-secret) why="the secret was missing: it is not set up, or the pull request comes from a fork or from Dependabot, which never receive secrets." ;;
            not-registered) why="the plugin was not registered." ;;
            *) why="the Jetpack Beta Builder did not accept the build. See the [workflow run]($run_url)." ;;
          esac

          {
            echo "### Test the build"
            echo
            echo "#### Option 1. Jetpack Beta"
            echo
            if [ "$BETA_BUILDER" = sent ]; then
              echo "- Install and activate [Jetpack Beta](https://jetpack.com/beta/#download-and-install)."
              echo "- Use this build by searching for PR number \`$PR_NUMBER\` or branch name \`$PR_HEAD_REF\` in your-test.site/wp-admin/admin.php?page=jetpack-beta&plugin=$PLUGIN_SLUG"
              echo
              echo ":information_source: The build installs as a regular plugin. Where a host already runs Fraud Protection as a must-use plugin, the build takes over once it is active. A site that is connected to WordPress.com sends its payment attempts to the live fraud service, so use test data only."
            else
              echo ":construction: Not available yet. Jetpack Beta only installs builds that the Jetpack Beta Builder serves. For that, WooCommerce Fraud Protection has to be registered with the Jetpack Beta Builder, and this repository needs the \`FRAUD_PROTECTION_LIVE_BRANCH_SECRET\` secret. In this run, $why"
              echo
              echo "Until then, download \`playground-preview-$GITHUB_RUN_ID\` from the [workflow run]($run_url#artifacts), unzip it, and upload \`$PLUGIN_SLUG.zip\` on your test site under Plugins > Add Plugin > Upload Plugin. A site that is connected to WordPress.com sends its payment attempts to the live fraud service, so use test data only."
            fi
            echo
            echo "#### Option 2. Jurassic Ninja - available for logged-in A12s"
            echo
            if [ "$BETA_BUILDER" = sent ]; then
              echo ":warning: Log in at [jurassic.ninja](https://jurassic.ninja/) first. Without a login, the link below takes you to the Jurassic Ninja homepage and no site is created."
              echo
              echo ":rocket: [Launch a JN site with this branch and sample products](https://jurassic.ninja/create/?jetpack-beta&nojetpack&woocommerce&woocommerce-import-sample-data&branches.$PLUGIN_SLUG=$branch_in_url) :rocket:"
              echo
              echo ":information_source: The site may already run a released copy of Fraud Protection as a must-use plugin. The branch build is a regular plugin and takes over while it is active. If you connect the site to WordPress.com, it sends its payment attempts to the live fraud service, so use test data only."
            else
              echo ":construction: Not available yet. Jurassic Ninja installs a branch through Jetpack Beta, so it needs what Option 1 needs."
            fi
            echo
            echo "#### Option 3. WordPress Playground - runs in your browser"
            echo
            echo "- :test_tube: [Open with sample data]($PLAYGROUND_SAMPLE_URL): the Fraud prevention settings with made-up payment activity and custom rules."
            echo "- :seedling: [Open empty]($PLAYGROUND_EMPTY_URL): the same store with no payment activity and no rules."
            echo
            echo ":information_source: A Playground site cannot connect to WordPress.com, so the fraud service checks nothing: a payment attempt goes through unless a custom rule blocks it, and \"Blocked automatically\" only appears in the sample data. To try a rule, block an email address, then buy the test product with that address on the Checkout page (Checkout block) or the \"Shortcode checkout\" page, paying with cash on delivery. The sample rows are random, and providers named \`wfp_demo_*\` are placeholders. The links stop working 14 days after the last build."
            echo
            echo "---"
            echo
            echo "Build info:"
            echo
            echo "- Latest commit: $PR_HEAD_SHA"
            echo "- Build time: $(date -u "+%Y-%m-%d %H:%M:%S UTC")"
            echo
            echo "_Note: the build is updated when a new commit is pushed to this PR._"
          } > comment.md

          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # A pull request from a fork gets a read-only token, so its comment stays in the run summary.
      - name: Add or update the comment on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("### Test the build"))) | .id' | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -X PATCH -F body=@comment.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
          fi
